site_name: Peyton Pope
site_url: https://pdot.dev
theme:
  name: material
  custom_dir: docs/overrides
  font:
    text: Roboto
  icon:
    logo: material/alpha-p-box
  favicon: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.code.select
    - navigation.footer

  palette:
    scheme: slate
    primary: blue grey
    accent: amber

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  # Enables :material-*: / :fontawesome-*: icon shortcodes, used by the
  # Source / Live link buttons at the top of each project page.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - tags

extra:
  generator: false 
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/peyton-pope/
    - icon: fontawesome/brands/github
      link: https://github.com/pdotpope

extra_css:
  - assets/style.css

nav:
  - Home: index.md
  - Projects:
    - Film Ratings Database: projects/pmdb.md
    - SignCraft WebApp: projects/signcraft.md
    - Playoff ML Model: projects/cfp-predictor.md
    - Healthcare Data Warehouse: projects/healthcare-dw.md
    - Spotify Pattern Mining: projects/spotify-ds.md
    # - Streamlit TenniSim: projects/tennis-sim.md
    - Churn Classifier: projects/churn-classifier.md
    - Web Bracket Generator: projects/cfpbracket.md
    - Church Map Viz: projects/churchds.md
    - MyBlocker Extension: projects/myblocker.md

    # - Portfolio Website: projects/portfolio.md
  # - Skills: tags.md

copyright: v2.1.0